<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="stylesheet" href="/fonts/fonts.css">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Pedal stage</title>
<style>
  :root { --fg:#fff; --bg:#000; --dim:rgba(255,255,255,.45); --accent:#E2C27E; --blue:#8DB5DE; --warn:#F5CF72; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:Archivo,Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; cursor:none; }
  body.show-cursor { cursor:auto; }
  .wrap { position:fixed; inset:0; display:grid; grid-template-rows:auto 1fr auto; padding:3vh 4vw; gap:2vh; }
  .top { display:flex; align-items:baseline; justify-content:space-between; gap:3vw; }
  .song { font-size:5vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { font-size:3vh; color:var(--dim); white-space:nowrap; } .meta b { color:var(--fg); }
  .mid { display:grid; grid-template-columns:1.3fr 1fr; gap:4vw; align-items:center; min-height:0; }
  .now { display:grid; gap:1.5vh; }
  .note { font-size:3.4vh; font-weight:700; color:#F5CF72; min-height:1em; }
  .label { font-size:2.4vh; letter-spacing:.25em; text-transform:uppercase; color:var(--dim); }
  .section { font-size:12vh; font-weight:900; line-height:1; letter-spacing:-.02em; }
  .count { font-size:6vh; color:var(--dim); font-variant-numeric:tabular-nums; } .count b { color:var(--warn); font-size:9vh; font-weight:900; }
  .next { border-left:.6vh solid var(--blue); padding-left:3vw; display:grid; gap:1vh; }
  .next .name { font-size:7vh; font-weight:800; color:var(--blue); line-height:1.05; }
  .next .in { font-size:3.2vh; color:var(--dim); font-variant-numeric:tabular-nums; }
  .lyrics { font-size:3.6vh; color:var(--dim); line-height:1.3; max-height:26vh; overflow:hidden; }
  .lyrics .cur { color:var(--fg); }
  .bottom { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:3vw; }
  .beats { display:flex; gap:1.2vh; } .beat { width:5vh; height:5vh; border-radius:50%; border:.4vh solid var(--dim); transition:background .06s, transform .06s; } .beat.on { background:var(--accent); border-color:var(--accent); transform:scale(1.15); } .beat.down.on { background:var(--warn); border-color:var(--warn); }
  .bar { height:1.6vh; border-radius:1vh; background:rgba(255,255,255,.12); overflow:hidden; position:relative; } .bar i { position:absolute; left:0; top:0; bottom:0; background:var(--accent); } .bar s { position:absolute; top:0; bottom:0; width:.3vh; background:rgba(255,255,255,.35); }
  .time { font-size:3.4vh; font-variant-numeric:tabular-nums; color:var(--dim); } .time b { color:var(--fg); }
  .flow { display:flex; flex-wrap:wrap; gap:.8vh; font-size:2.2vh; } .flow span { padding:.4vh 1.4vh; border-radius:99px; border:.25vh solid rgba(255,255,255,.2); color:var(--dim); } .flow span.cur { background:var(--blue); color:#0B0D10; border-color:var(--blue); font-weight:800; } .flow span.past { opacity:.35; }
  .idle { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:2vh; } .idle b { font-size:6vh; } .idle span { color:var(--dim); font-size:3vh; }
  .status { position:fixed; right:1.2vh; bottom:1vh; font-size:1.6vh; color:var(--dim); opacity:.7; }
  .stopped .section { color:var(--dim); }
  .svc { position:fixed; top:1vh; right:2vw; font-size:2.6vh; color:var(--dim); font-variant-numeric:tabular-nums; z-index:5; } .svc b { color:var(--fg); } .svc .over { color:#ff6b6b; }
  .idle .svcbig { font-size:9vh; font-weight:900; color:var(--warn); font-variant-numeric:tabular-nums; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="idle" id="idle"><b>Central Pedal</b><span id="idleSub">Waiting for the Central Pedal…</span><div class="svcbig" id="svcBig" hidden></div></div>
<div class="wrap" id="wrap" hidden>
  <div class="top"><div class="song" id="song"></div><div class="meta" id="meta"></div></div>
  <div class="mid">
    <div class="now"><div class="label">Now</div><div class="section" id="section">—</div><div class="note" id="secNote"></div><div class="count" id="count"></div><div class="lyrics" id="lyrics"></div></div>
    <div class="next"><div class="label">Next</div><div class="name" id="nextName">—</div><div class="note" id="nextNote"></div><div class="in" id="nextIn"></div><div class="flow" id="flow"></div></div>
  </div>
  <div class="bottom"><div class="beats" id="beats"></div><div class="bar" id="bar"><i id="barFill"></i></div><div class="time" id="time"></div></div>
</div>
<div class="status" id="status"></div>
<div class="svc" id="svc" hidden></div>
<script src="common.js"></script>
<script>
(function () {
  var C = window.PPCompanion, esc = C.esc, $ = function (s) { return document.querySelector(s); };
  var last = null, lastAt = 0, beatMarks = null;
  document.addEventListener("mousemove", function () { document.body.classList.add("show-cursor"); clearTimeout(window.__cur); window.__cur = setTimeout(function () { document.body.classList.remove("show-cursor"); }, 2000); });
  document.addEventListener("keydown", function (e) { if (e.key === " ") C.action("playPause"); else if (e.key === "ArrowRight") C.action("nextSection"); else if (e.key === "ArrowLeft") C.action("prevSection"); });
  function fmt(t) { t = Math.max(0, Math.round(t)); return Math.floor(t / 60) + ":" + ("0" + (t % 60)).slice(-2); }
  function render(st) {
    var d = st.display; $("#status").textContent = st.connected ? "" : "reconnecting…";
    if (!d || !d.song) { $("#idle").hidden = false; $("#wrap").hidden = true; $("#idleSub").textContent = d ? "No song selected" : "Waiting for the Central Pedal…"; return; }
    $("#idle").hidden = true; $("#wrap").hidden = false; last = d; lastAt = performance.now();
    document.body.classList.toggle("stopped", !d.playing);
    $("#song").textContent = (d.song.index + 1) + ". " + d.song.name;
    $("#meta").innerHTML = "<b>" + esc(C.keyName(d.song.key)) + "</b> · <b>" + d.bpm + "</b> BPM · " + (d.bpb || 4) + "/4" + (d.countIn ? " · <b>count-in " + d.countIn + "</b>" : "");
    $("#section").textContent = d.section ? d.section.name : (d.song.hasTracks ? (d.playing ? "…" : "Ready") : "No tracks");
    var ls = d.lyrics || { lines: [], next: [] };
    $("#lyrics").innerHTML = (ls.lines || []).slice(0, 3).map(function (l) { return '<div class="cur">' + esc(l) + "</div>"; }).join("") + (ls.next || []).slice(0, 2).map(function (l) { return "<div>" + esc(l) + "</div>"; }).join("");
    $("#nextName").textContent = d.next ? d.next.name : (d.section ? "end of song" : "—");
    var secs0 = d.sections || [], nowS = d.section ? secs0[d.section.index] : null, nextS = d.next && d.section ? secs0[d.section.index + 1] : null;
    $("#secNote").textContent = d.section && d.section.note ? d.section.note : ""; $("#nextNote").textContent = nextS && nextS.note ? nextS.note : "";
    $("#section").style.color = d.section && d.section.color ? d.section.color : ""; $("#nextName").style.color = nextS && nextS.color ? nextS.color : "";
    var fl = d.flow, secs = d.sections || [];
    $("#flow").innerHTML = fl ? fl.entries.map(function (si, i) { var s = secs[si]; return '<span class="' + (i === fl.index ? "cur" : i < fl.index ? "past" : "") + '">' + esc(s ? s.name : "?") + "</span>"; }).join("") : secs.map(function (s, i) { return '<span class="' + (d.section && d.section.index === i ? "cur" : d.section && i < d.section.index ? "past" : "") + '">' + esc(s.name) + "</span>"; }).join("");
    var bpb = d.bpb || 4, beats = $("#beats");
    if (beats.children.length !== bpb) beats.innerHTML = Array.from({ length: bpb }, function (_, i) { return '<div class="beat' + (i === 0 ? " down" : "") + '"></div>'; }).join("");
    if (d.sections && d.duration) { var marks = d.sections.map(function (s) { return Math.round(s.start / d.duration * 1000) / 10; }).join("|"); if (marks !== beatMarks) { beatMarks = marks; $("#bar").innerHTML = '<i id="barFill"></i>' + d.sections.map(function (s) { return '<s style="left:' + (s.start / d.duration * 100) + '%"></s>'; }).join(""); } }
    tick();
  }
  function tick() {
    var d = last; if (!d) return;
    var pos = d.pos + (d.playing ? (performance.now() - lastAt) / 1000 * (d.speed || 1) : 0);
    var beat = d.beat || 1, frac = d.beatFrac || 0;
    if (d.playing && d.bpm) { var beatLen = 60 / d.bpm, elapsed = (performance.now() - lastAt) / 1000; var adv = frac * beatLen + elapsed; beat = ((beat - 1 + Math.floor(adv / beatLen)) % (d.bpb || 4)) + 1; frac = (adv % beatLen) / beatLen; }
    Array.prototype.forEach.call($("#beats").children, function (el, i) { el.classList.toggle("on", d.playing && i === beat - 1 && frac < 0.35); });
    var fill = $("#barFill"); if (fill && d.duration) fill.style.width = Math.min(100, pos / d.duration * 100) + "%";
    $("#time").innerHTML = "<b>" + fmt(pos) + "</b> / " + fmt(d.duration || 0) + (d.duration ? " · −" + fmt(Math.max(0, d.duration - pos)) : "");
    if (d.section) { var left = Math.max(0, d.section.end - pos); $("#count").innerHTML = d.playing ? "<b>" + fmt(left) + "</b> left" : "bar " + (d.bar || 1); }
    $("#nextIn").textContent = d.next && d.playing && d.section ? "in " + fmt(Math.max(0, d.section.end - pos)) : "";
  }
  setInterval(tick, 50);
  C.on(render);
  // the service countdown (the main admin's Service tab): before it starts, and the item running now
  var svc = null, svcOff = 0;
  function pollSvc() { fetch("/api/service", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { if (j) { svc = j; svcOff = j.now - Date.now(); } }).catch(function () { }); }
  function nextStart(sv, t) { var d = new Date(t), p = sv.time.split(":").map(Number), c = new Date(d.getFullYear(), d.getMonth(), d.getDate(), p[0], p[1], 0, 0); c.setDate(c.getDate() + (sv.day - d.getDay() + 7) % 7); if (c.getTime() < t - 60000) c.setDate(c.getDate() + 7); return c.getTime(); }
  function hms(sec) { var neg = sec < 0; sec = Math.abs(Math.round(sec)); var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (neg ? "-" : "") + (h ? h + ":" + ("0" + m).slice(-2) : m) + ":" + ("0" + x).slice(-2); }
  function paintSvc() {
    var el = $("#svc"), big = $("#svcBig"); if (!svc || !svc.services || !svc.services.length) { el.hidden = big.hidden = true; return; }
    var t = Date.now() + svcOff;
    if (svc.run) {
      var sv = svc.services.filter(function (x) { return x.id === svc.run.service; })[0], it = sv && sv.items[svc.run.item], nx = sv && sv.items[svc.run.item + 1];
      if (!it) { el.hidden = true; return; }
      var left = it.minutes * 60 - (t - svc.run.itemStart) / 1000;
      el.innerHTML = "▶ <b>" + esc(it.title) + '</b> <span class="' + (left < 0 ? "over" : "") + '">' + hms(left) + "</span>" + (nx ? " · next: " + esc(nx.title) : ""); el.hidden = false; big.hidden = true;
    } else {
      var best = null; svc.services.forEach(function (sv) { var at = nextStart(sv, t); if (!best || at < best.at) best = { sv: sv, at: at }; });
      var secs = (best.at - t) / 1000;
      el.innerHTML = esc(best.sv.name) + (secs < 86400 ? " in <b>" + hms(secs) + "</b>" : ""); el.hidden = secs > 86400;
      big.textContent = secs < 7200 ? best.sv.name + " in " + hms(secs) : ""; big.hidden = secs >= 7200;
    }
  }
  pollSvc(); setInterval(pollSvc, 3000); setInterval(paintSvc, 500);
})();
</script>
</body>
</html>
