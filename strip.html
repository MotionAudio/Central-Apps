<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Central Pedal — bar screen</title>
<!-- (11.0) The long touch screen above the footswitches on the main board rev B (1480 x 320). It shows what's playing
     and lets you scroll through the sounds, the setlist, the loops and the scenes. It talks to the driver only
     (pedal-driver.py "strip"); the app on the 7" screen does the playing. -->
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/central-tokens.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: pan-x; }
  body { display: grid; grid-template-rows: auto 1fr; }
  #top { display: flex; align-items: center; gap: var(--s3); padding: 6px 14px; border-bottom: 1px solid var(--line); background: var(--panel); min-height: 44px; }
  #top .song { font-size: var(--fs-lg); font-weight: 600; font-stretch: var(--wide); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #top .song small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  #top .sec { color: var(--accent); font-weight: 600; white-space: nowrap; }
  #top .next { color: var(--muted); white-space: nowrap; }
  #top .time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  #top .bat { color: var(--muted); font-size: var(--fs-sm); white-space: nowrap; }
  #top .bat.low { color: var(--danger); }
  #tabs { display: flex; gap: 2px; }
  #tabs button { background: transparent; border: 0; color: var(--muted); font: inherit; font-size: var(--fs-sm); padding: 6px 12px; border-radius: var(--r-pill); min-height: 36px; }
  #tabs button.on { background: var(--accent); color: var(--accentText); font-weight: 600; }
  #bar { height: 4px; background: var(--bg2); }
  #bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 200ms linear; }
  #bar.playing i { background: var(--live); }
  #pages { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; height: 100%; }
  #pages::-webkit-scrollbar { display: none; }
  .page { flex: 0 0 100%; scroll-snap-align: start; height: 100%; box-sizing: border-box; padding: 8px 14px; overflow-x: auto; overflow-y: hidden; display: flex; align-items: stretch; gap: 8px; }
  .page::-webkit-scrollbar { display: none; }
  .tile { flex: 0 0 auto; width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-height: 0; position: relative; }
  .tile b { font-size: var(--fs-md); line-height: var(--lh-tight); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tile small { color: var(--muted); font-size: var(--fs-xs); }
  .tile.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tile.live { background: linear-gradient(180deg, var(--panel2), var(--panel)); }
  .tile.live::before { content: "●"; color: var(--live); position: absolute; top: 8px; right: 10px; font-size: 12px; }
  .tile.sel::after { content: "▶"; color: var(--accent); position: absolute; bottom: 8px; right: 10px; font-size: 12px; }
  .tile .n { position: absolute; top: 6px; left: 10px; color: var(--dim); font-size: var(--fs-xs); }
  .tile.pad b { margin-top: 10px; }
  .tile.wide { width: 230px; }
  .tile.loop { width: 170px; text-align: center; justify-content: center; }
  .tile.loop .st { font-size: var(--fs-lg); font-weight: 700; color: var(--accent); }
  .tile.loop.rec .st, .tile.loop.dub .st { color: var(--live); }
  .tile.loop.play .st { color: var(--ok); }
  .tile.loop .row { display: flex; gap: 6px; justify-content: center; margin-top: 8px; }
  .tile.loop .row button { background: var(--panel2); border: 1px solid var(--line); color: var(--text); font: inherit; font-size: var(--fs-xs); border-radius: var(--r-sm); padding: 6px 8px; min-height: 34px; }
  .sections { display: flex; gap: 6px; }
  .sections .tile { width: 120px; }
  .sections .tile.now { border-color: var(--accent); }
  .empty { color: var(--dim); align-self: center; padding: 0 20px; font-size: var(--fs-md); }
  .nowpage .big { flex: 0 0 auto; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; display: flex; flex-direction: column; justify-content: center; }
  .nowpage .big .t { font-size: var(--fs-2xl); font-weight: 700; font-stretch: var(--wide); line-height: 1.05; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .nowpage .big .k { color: var(--accent); font-size: var(--fs-lg); margin-top: 6px; }
  .nowpage .pads { display: flex; gap: 8px; }
  #toast { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--panel3); color: var(--text); padding: 8px 16px; border-radius: var(--r-pill); opacity: 0; transition: opacity var(--dur); pointer-events: none; font-size: var(--fs-sm); }
  #toast.on { opacity: 1; }
  #off { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); background: var(--bg); font-size: var(--fs-lg); }
  #off.on { display: flex; }
</style>
</head>
<body>
  <div id="top">
    <div id="tabs"></div>
    <div class="song" id="song">Central Pedal</div>
    <div class="sec" id="sec"></div>
    <div class="next" id="next"></div>
    <div class="time" id="time"></div>
    <div class="bat" id="bat"></div>
  </div>
  <div id="bar"><i></i></div>
  <div id="pages"></div>
  <div id="toast"></div>
  <div id="off">Waiting for the Central Pedal…</div>
  <script src="js/strip.js"></script>
</body>
</html>
