<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My in-ear mix</title>
<link rel="stylesheet" href="/fonts/fonts.css"><link rel="stylesheet" href="/inear.css">
<style>
  :root { --bg:#08111d; --panel:#101e31; --panel2:#152a43; --line:#294966; --text:#ecf7ff; --muted:#9bb2c9; --accent:#5de6b0; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 Inter, ui-sans-serif, system-ui, sans-serif; }
  body { padding:14px 14px calc(14px + env(safe-area-inset-bottom)); }
  button, select, input:not([type=range]):not([type=checkbox]) { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
  button.primary { background:var(--accent); color:#062218; border-color:var(--accent); font-weight:700; }
  button.danger, button.on.danger { background:#7a2020; border-color:#ff7878; }
  [hidden] { display:none !important; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  label { display:inline-flex; gap:6px; align-items:center; }
  .login { max-width:420px; margin:10vh auto; display:flex; flex-direction:column; gap:12px; }
  .login label { flex-direction:column; align-items:stretch; }
  h1 { font-size:20px; margin:0 0 4px; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>My in-ear mix</h1><p class="muted">From the Central Usage audio host. Put this phone on the same Wi-Fi.</p>
  <label>Your name<input id="nm" autocomplete="name" placeholder="Sarah (vocals)"></label>
  <label>In-ear code<input id="cd" inputmode="numeric" placeholder="4 digits from the sound desk"></label>
  <button class="primary" id="go">Continue</button>
</div>
<div id="app"></div>
<script src="/mixer-model.js"></script><script src="/inear-client.js"></script><script src="/inear-ui.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), get = function (k) { try { return localStorage.getItem("cu-phone-" + k) || ""; } catch (_) { return ""; } }, set = function (k, v) { try { localStorage.setItem("cu-phone-" + k, v); } catch (_) { } };
  var name = q.get("name") || get("name"), code = q.get("code") || get("code"), ui = null;
  function start() { document.getElementById("login").hidden = true; ui = CUInEarUI.mount(document.getElementById("app"), { url: (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws", code: code, name: name, id: CUInEar.deviceId() }); }
  document.getElementById("go").onclick = function () { name = document.getElementById("nm").value.trim(); code = document.getElementById("cd").value.trim(); if (!name || !code) return; set("name", name); set("code", code); start(); };
  if (name && code) start(); else { document.getElementById("login").hidden = false; document.getElementById("nm").value = name; document.getElementById("cd").value = code; }
})();
</script>
</body>
</html>
