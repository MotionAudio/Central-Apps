<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Central Pedal - starting</title>
<style>
  html, body { margin: 0; height: 100%; background: #08111d; color: #e8f1fb; font: 16px/1.4 Inter, ui-sans-serif, system-ui, "DejaVu Sans", sans-serif; }
  body { display: grid; place-items: center; text-align: center; }
  h1 { margin: 0 0 6px; font-size: clamp(28px, 5vw, 56px); letter-spacing: .02em; }
  p { margin: 0; color: #8fa6bf; font-size: clamp(14px, 2vw, 20px); }
  .ring { width: 54px; height: 54px; margin: 0 auto 26px; border-radius: 50%; border: 5px solid #1d3048; border-top-color: #5ce6b0; animation: spin 1s linear infinite; }
  small { display: block; margin-top: 22px; color: #4f6680; font-size: 13px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style></head>
<body><div>
  <div class="ring"></div>
  <h1>Central Pedal</h1>
  <p id="msg">Starting up…</p>
  <small id="tip"></small>
</div>
<script>
  // Opened by the screen session while the Central Pedal service is still starting: waits for it, then
  // opens the real page (the address after the #).
  var ver = (location.search.match(/[?&]v=([^&#]+)/) || [])[1]; if (ver) document.querySelector("h1").textContent = "Central Pedal " + decodeURIComponent(ver);
  var next = decodeURIComponent(location.hash.slice(1)) || "http://127.0.0.1:8766/app/#resume", tries = 0;
  var probe = next.replace(/^(https?:\/\/[^/]+).*$/, "$1/"), t0 = Date.now();
  function check() {
    // asks every 0.2 s (a refused local connection costs nothing), so the app opens the moment the service is up
    var s = (Date.now() - t0) / 1000;
    tries++;
    if (s >= 20) document.getElementById("msg").textContent = "Still starting… (the first start after an update takes a little longer)";
    if (s >= 90) document.getElementById("tip").textContent = "Taking too long? Turn the power off and on again. If it keeps happening, plug in a keyboard and press Ctrl+Alt+F2 to log in and run: journalctl -u pad-pedal-driver";
    fetch(probe + "?t=" + Date.now(), { mode: "no-cors", cache: "no-store" })
      .then(function () { document.getElementById("msg").textContent = "Ready"; location.replace(next); })
      .catch(function () { setTimeout(check, 200); });
  }
  check();
</script>
</body></html>
