# Central Control OS: draw the screens with the Pi's own display chip (vc4, full KMS) through the
# modesetting driver. Without this, a "Lite" system can end up on the plain framebuffer driver
# (no resolution control, no hotplug - a picture stuck at whatever the monitor said at boot, often
# 1024x768 and blurry) or on the 3D-only v3d device (no picture at all).
Section "OutputClass"
    Identifier "Central Control vc4"
    MatchDriver "vc4"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection
