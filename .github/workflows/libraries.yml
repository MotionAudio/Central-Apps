# Builds the sound libraries - one zip per plan (Central Keys, Central Instrument, Central Plugins, Central Pedals) - and
# publishes them on the GitHub release tagged "libraries" (made if it isn't there, its files replaced if it is), with
# libraries-index.json (what the website's /v1/libraries and the apps read) and SHA256SUMS - and (10.2) a 30-second
# preview MP3 of each pad, loop, instrument preset, keys preset and IR (tools/make-previews.py), so people can hear them
# before they download.
#
# Runs by hand (Actions -> Sound libraries -> Run workflow) and whenever a library's sources change on main or on
# release/9.8.0 (so the files are built before that release).
# The "libraries" release is a pre-release and never "latest", so the apps' update checks (which read the latest
# release) never see it.
#
# Where the zips are downloaded from: the website's LIBRARIES_BASE_URL (Render -> Environment). Today that is this
# release: https://github.com/MotionAudio/central-apps/releases/download/libraries
#
# Cloudflare R2, later: the last step below copies the zips to an R2 bucket. It is off until it is set up:
#   1. Cloudflare -> R2 -> Create bucket (e.g. central-libraries); Settings -> Public access: connect a custom domain
#      (e.g. libraries.motionaudio.org) or allow the r2.dev URL.
#   2. R2 -> Manage API tokens -> Create token, "Object Read & Write" on that bucket. Then in GitHub -> Settings ->
#      Secrets and variables -> Actions, add the secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET
#      (never paste them anywhere else).
#   3. Add the repository variable R2_UPLOAD = on (Settings -> Secrets and variables -> Actions -> Variables), set
#      R2_PUBLIC_URL to the bucket's public address and R2_HYMNS_URL to that address plus /central-tracks, so the indexes
#      point there. Then run this workflow with nothing in "only".
#   4. When it has finished, set LIBRARIES_BASE_URL and HYMNS_BASE_URL on Render to those same two addresses and redeploy. The apps and the website then download
#      from Cloudflare; the GitHub release stays as a copy.
name: Sound libraries
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Build one library only (its id, e.g. central-pads-library) - empty: all of them"
        required: false
        default: ""
  push:
    branches: [main, release/9.8.0, release/10.0.0]   # (a release branch: the files are built before that release)
    paths:
      - libraries/**
      - hymns/**
      - tools/sounds-vcsl.py
      - tools/sounds-sfz.py
      - tools/sfz_render.py
      - tools/make-pads.py
      - tools/make-pad-loops.py
      - tools/make-synths.py
      - tools/pad_dsp.py
      - tools/pad_voices.py
      - tools/pad_sources.py
      - tools/make-loops.py
      - tools/make-hymns.py
      - tools/hymn_arranger.py
      - tools/worship_band.py
      - tools/sampler.py
      - hymns/guide/**
      - tools/midi_render.py
      - tools/vcsl-names.txt
      - tools/make-irs.py
      - tools/make-utility.py
      - tools/make-fixture-library.py
      - tools/build-libraries.py
      - tools/make-previews.py
      - tools/build-libraries.sh
      - sounds-vsco.py
      - .github/workflows/libraries.yml
permissions:
  contents: write
concurrency:
  group: libraries
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      WORK: ${{ github.workspace }}/work
      OUT: ${{ github.workspace }}/dist/libraries
      LIBRARIES_BASE_URL: ${{ vars.R2_UPLOAD == 'on' && vars.R2_PUBLIC_URL || 'https://github.com/MotionAudio/central-apps/releases/download/libraries' }}
      ONLY: ${{ github.event.inputs.only }}
      HYMNS_BASE_URL: ${{ vars.R2_UPLOAD == 'on' && vars.R2_HYMNS_URL || 'https://github.com/MotionAudio/central-apps/releases/download/central-tracks' }}
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy fluidsynth ffmpeg libmp3lame0 >/dev/null
      - name: Cache the VCSL downloads and built sounds
        uses: actions/cache@v4
        with:
          path: work/sounds
          key: libraries-sounds-${{ hashFiles('tools/sounds-vcsl.py', 'tools/sounds-sfz.py', 'tools/sfz_render.py', 'tools/make-pads.py', 'tools/make-synths.py', 'tools/pad_dsp.py', 'tools/pad_voices.py', 'tools/pad_sources.py', 'sounds-vsco.py') }}
      - name: Build the libraries
        run: bash tools/build-libraries.sh "$OUT"
      - name: Check every SoundFont plays (FluidSynth loads it)
        run: |
          for f in work/sounds/*.sf2; do
            fluidsynth -ni -F /tmp/check.wav "$f" >out.txt 2>&1 || true   # (no MIDI file: it loads the bank and stops)
            if grep -qiE "error|not a soundfont" out.txt; then echo "$f:"; cat out.txt; exit 1; fi
          done
      - name: Publish on the "libraries" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Libraries for Central Keys, Central Instrument, Central Plugins, Central Pedals, Central Pads and Central Utility, and the lights page's fixture library. Anyone can download them; they open with the plan's package key (Settings -> Packages in any app). libraries-index.json lists what's in each. Built from ${GITHUB_SHA::7}."
          if gh release view libraries >/dev/null 2>&1; then
            gh release edit libraries --prerelease --latest=false --title "Sound libraries" --notes "$NOTES"
          else
            gh release create libraries --prerelease --latest=false --title "Sound libraries" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          # (one library rebuilt: the others' files stay; the index and SHA256SUMS list what was built this time plus what's there)
          if [ -n "$ONLY" ]; then
            gh release download libraries -p libraries-index.json -D old || true
            python3 - "$OUT" old/libraries-index.json <<'PY'
          import hashlib, json, os, sys
          out, old = sys.argv[1], sys.argv[2]
          new = json.load(open(os.path.join(out, "libraries-index.json")))
          if os.path.isfile(old):
              ids = {e["id"] for e in new["libraries"]}
              new["libraries"] = [e for e in json.load(open(old)).get("libraries", []) if e["id"] not in ids] + new["libraries"]
          json.dump(new, open(os.path.join(out, "libraries-index.json"), "w"), indent=1)
          with open(os.path.join(out, "SHA256SUMS"), "w") as f:
              for e in new["libraries"]:
                  f.write("%s  %s\n" % (e["sha256"], e["file"]))
              f.write("%s  libraries-index.json\n" % hashlib.sha256(open(os.path.join(out, "libraries-index.json"), "rb").read()).hexdigest())
          PY
          fi
          # (10.2: the 30-second previews go up before the index that lists them)
          ls "$OUT"/preview--*.mp3 >/dev/null 2>&1 && gh release upload libraries "$OUT"/preview--*.mp3 --clobber
          gh release upload libraries "$OUT"/*.zip "$OUT/libraries-index.json" "$OUT/SHA256SUMS" --clobber
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/libraries"
          ls -l "$OUT"

      # ---- (10.2) the fixture library: the Open Fixture Library (MIT) and the QLC+ fixture definitions (Apache 2.0), as
      # one file the lights page's "Update the fixture library" downloads (the apps carry a copy too)
      - name: The fixture library
        if: ${{ env.ONLY == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone -q --depth 1 https://github.com/OpenLightingProject/open-fixture-library work/ofl
          git clone -q --depth 1 https://github.com/mcallegari/qlcplus work/qlcplus
          python3 tools/make-fixture-library.py --ofl work/ofl --qlc work/qlcplus --out dist/fixture-library.json.gz \
            --ofl-commit "$(git -C work/ofl rev-parse HEAD)" --qlc-commit "$(git -C work/qlcplus rev-parse HEAD)"
          gh release upload libraries dist/fixture-library.json.gz --clobber

      # ---- Central Tracks hymns (10.0): public-domain hymns in our arrangements, played on the sounds built above
      - name: Cache the hymns' instrument samples
        if: ${{ env.ONLY == '' }}
        uses: actions/cache@v4
        with:
          path: work/samples
          key: hymn-samples-${{ hashFiles('tools/sampler.py') }}
      - name: Central Tracks hymns (stems, song files, previews)
        if: ${{ env.ONLY == '' }}
        run: |
          # (10.2: played on the sampled instruments themselves - Salamander piano, Virtuosity drums, Growlybass, the
          #  Black And Green guitars, VSCO 2 strings - fetched from their repositories by tools/sampler.py and cached)
          pip install --quiet soundfile pyloudnorm scipy
          python3 tools/make-hymns.py --samples work/samples --out dist/hymns --base-url "$HYMNS_BASE_URL"
      - name: Publish the hymns on the "central-tracks" release
        if: ${{ env.ONLY == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Central Tracks hymns: public-domain hymns in Motion Audio's own arrangements (stems, song files with sections, lyrics and chords, previews). The website lists them in Central Tracks from hymns-index.json. Built from ${GITHUB_SHA::7}."
          if gh release view central-tracks >/dev/null 2>&1; then
            gh release edit central-tracks --prerelease --latest=false --title "Central Tracks hymns" --notes "$NOTES"
          else
            gh release create central-tracks --prerelease --latest=false --title "Central Tracks hymns" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload central-tracks dist/hymns/release/* --clobber
          echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/central-tracks"

      # ---- Cloudflare R2 (OFF until set up - see the top of this file). Turn on with the repository variable R2_UPLOAD = on.
      - name: Copy to Cloudflare R2 (disabled until R2_UPLOAD = on)
        if: ${{ vars.R2_UPLOAD == 'on' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] || { echo "R2 secrets missing (R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET)"; exit 1; }
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for f in "$OUT"/*.zip; do
            aws s3 cp "$f" "s3://${R2_BUCKET}/$(basename "$f")" --endpoint-url "$ENDPOINT" --content-type application/zip
          done
          for f in "$OUT"/preview--*.mp3; do
            [ -f "$f" ] && aws s3 cp "$f" "s3://${R2_BUCKET}/$(basename "$f")" --endpoint-url "$ENDPOINT" --content-type audio/mpeg --cache-control "max-age=86400"
          done
          aws s3 cp "$OUT/SHA256SUMS" "s3://${R2_BUCKET}/SHA256SUMS" --endpoint-url "$ENDPOINT" --content-type text/plain
          # the Central Tracks hymns, under central-tracks/ (their index last, so it never points at files that aren't there)
          if [ -z "$ONLY" ] && [ -d dist/hymns/release ]; then
            aws s3 cp dist/hymns/release "s3://${R2_BUCKET}/central-tracks/" --recursive --exclude hymns-index.json --endpoint-url "$ENDPOINT"
            aws s3 cp dist/hymns/release/hymns-index.json "s3://${R2_BUCKET}/central-tracks/hymns-index.json" --endpoint-url "$ENDPOINT" --content-type application/json --cache-control "max-age=300"
          fi
          # (the index last: the apps only see a new version once its zip is there)
          aws s3 cp "$OUT/libraries-index.json" "s3://${R2_BUCKET}/libraries-index.json" --endpoint-url "$ENDPOINT" --content-type application/json --cache-control "max-age=300"
