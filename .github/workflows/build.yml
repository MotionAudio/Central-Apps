# Builds every installer of the four apps and tests them on each system:
#   Central Pedal          the Raspberry Pi (its update is central-control-source.zip, made by make-release.sh)
#   Central Pedal Control  Mac, Windows, Linux, Android + the iPhone / iPad project   central-pedal-control-*, central-pedal-control-mobile
#   Central Services       Mac, Windows, Linux, Android + the iPhone / iPad project   central-services-*, central-services-mobile
#   Central Control        Linux, Windows, Mac - the main admin and admins       CentralControl-* (the release adds central-usage-* copies)
#   Central Usage          Mac, Windows, Linux, Android + the iPhone / iPad project  CentralUsage-*, central-usage-mobile
# Central Control and Central Usage are one code base (central-usage/; usage-builder.js packs Central Usage), with
# the native helpers (cu-mixer, cu-ndi, cu-rig, cu-video), the pinned ffmpeg, the built-in sounds and the offline
# speech model's runtime; Central Control also carries the player window (the Central Pedal app and its driver).
# Used by release.yml (every release ships all of them); also runs by itself on the work branches and by hand.
#
# Play any sound (central-usage/native/playany/) is built into cu-rig everywhere; the natives job also builds it as
# the Raspberry Pi's plugin (central-playany.so, LADSPA + LV2) for Linux arm64 and x64 into bin/linux-<arch>/,
# which the Pi release (central-control-source.zip, release.yml) carries.
# Adding a native helper for every system: build it in the "natives" job (Linux, Windows cross-compiled) and in
# the macos jobs, put it in central-usage/native/build/, list it in central-usage/package.json ->
# build.extraResources[0].filter, and check it in the "packed apps" steps.
# rig-map.json (which built-in effect plays each pedal of js/pedals.js) is always made here from the current
# catalogue (tools/make-rig-map.js) - never checked in - so new pedals map by themselves.
name: Build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [platforms, v8.1]
permissions:
  contents: read
jobs:
  natives:
    name: Native helpers (Linux + Windows), ffmpeg and sounds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Compilers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix gcc-aarch64-linux-gnu p7zip-full libx11-dev liblilv-dev libsuil-dev lv2-dev   # (C++ for the plugin host; the X11, lilv and suil headers for Linux; arm64 C for the Pi's play-any plugin)
      - name: Build (Linux x64, Windows x64) - the rig map comes from js/pedals.js here
        run: |
          bash tools/ci-run.sh "native build (Linux)" make -C central-usage/native -j4
          bash tools/ci-run.sh "native build (Windows)" make -C central-usage/native -j4 TARGET=win OUT=build-win
          bash tools/ci-run.sh "cu-video (Linux)" make -C central-usage/native/video
          bash tools/ci-run.sh "cu-video (Windows)" make -C central-usage/native/video CC=x86_64-w64-mingw32-gcc EXE=.exe LIBS="-lole32 -lwinmm -static"
          mv central-usage/native/build/cu-video.exe central-usage/native/build-win/
          bash tools/ci-run.sh "play any sound: the Pi's plugin (Linux arm64)" make -C central-usage/native CC=aarch64-linux-gnu-gcc OUT=build-linux-arm64 playany
          file central-usage/native/build-linux-arm64/central-playany.lv2/central-playany.so | grep -q aarch64 || { echo "::error::the arm64 play-any plugin is not arm64"; exit 1; }
          mkdir -p bin/linux-aarch64 bin/linux-x86_64
          cp -r central-usage/native/build-linux-arm64/central-playany.lv2 bin/linux-aarch64/
          cp -r central-usage/native/build/central-playany.lv2 bin/linux-x86_64/
          node -e 'const m=require("./central-usage/native/build/rig-map.json"),P=require("./js/pedals.js");const miss=P.pedals.filter(p=>!m[p.id]).map(p=>p.id);if(miss.length){console.log("::error::pedals missing from the rig map: "+miss.join(", "));process.exit(1)}console.log("rig map: "+Object.keys(m).length+" pedals, all of js/pedals.js")'
      - name: ffmpeg (pinned, checksum-checked)
        run: |
          bash tools/fetch-ffmpeg.sh linux-x64 central-usage/native/build
          bash tools/fetch-ffmpeg.sh win-x64 central-usage/native/build-win
      - name: Test the engine, the rig, the video helpers (Linux)
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig
          bash tools/ci-run.sh "play any sound: DSP test" central-usage/native/build/test-playany
          make -C central-usage/native build/test-playany-plugin
          bash tools/ci-run.sh "play any sound: plugin test" central-usage/native/build/test-playany-plugin central-usage/native/build/central-playany.lv2/central-playany.so central-usage/native/playany/central-playany.lv2/central-playany.ttl
          bash tools/ci-run.sh "updater test" node central-usage/test-updater.mjs
          bash tools/ci-run.sh "lights auto test" node central-usage/test-lights-auto.mjs
          python3 -c "import numpy" 2>/dev/null || python3 -m pip install --quiet numpy
          bash tools/ci-run.sh "library test (pedals, plans, the orchestra builder)" python3 test_library.py
          bash tools/ci-run.sh "sound libraries test (definitions, IRs, VCSL builder, zips, installer)" python3 test_libraries.py
          bash tools/ci-run.sh "Pi sound set-up test (the jack is never left out, outputs that aren't there play on 1-2)" python3 test_audio_routing.py
          bash tools/ci-run.sh "sound library installer test (computers)" node central-usage/test-libraries.mjs
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Built-in sounds
        run: bash tools/fetch-builtin-sounds.sh central-usage/native/sounds
      - uses: actions/upload-artifact@v4
        with:
          name: natives-linux-x64
          retention-days: 7
          path: |
            central-usage/native/build/
            !central-usage/native/build/obj/
      - uses: actions/upload-artifact@v4
        with:
          name: natives-win-x64
          retention-days: 7
          path: |
            central-usage/native/build-win/
            !central-usage/native/build-win/obj/
      - uses: actions/upload-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: natives-pi, path: bin/, retention-days: 7 }   # (the Pi release: release.yml puts it in central-control-source.zip)

  linux:
    name: Linux (deb + AppImage)
    needs: natives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: natives-linux-x64, path: central-usage/native/build }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Smoke test - the driver answers (Python), then bundle it for the player window (PyInstaller)
        timeout-minutes: 20
        run: |
          pip install --quiet websockets==13.1 gpiozero==2.0.1 pillow
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh python pedal-driver.py
          PYTHON=python bash tools/ci-run.sh "bundle the driver" bash tools/build-driver.sh central-usage/driver-dist
          bash tools/ci-run.sh "bundled driver smoke test" bash tools/smoke-driver.sh central-usage/driver-dist/pedal-driver/pedal-driver
      - name: Central Control
        working-directory: central-usage
        run: |
          chmod +x native/build/cu-* native/build/ffmpeg || true
          node ../tools/make-rig-map.js native/build/rig-map.json
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          bash prepare-player.sh
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "center test" node test-center.mjs
          bash ../tools/ci-run.sh "hub sync test" node test-hubsync.mjs
          bash ../tools/ci-run.sh "pedal audio test" node test-piaudio.mjs
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --linux deb AppImage --x64 --publish never -c.extraMetadata.name=central-control
          node ../tools/check-packaged.js dist/linux-unpacked/resources/app.asar
      - name: Smoke test - the packed app (helpers, video, sounds, the player, the speech model's runtime)
        run: |
          R=central-usage/dist/linux-unpacked/resources
          "$R/native/cu-mixer" --version && "$R/native/cu-rig" --version && ls "$R/native/rig-map.json" "$R/sounds/"*.sf2 > /dev/null
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$R/native"
          ls "$R/player/pedal-driver.py" "$R/player/index.html" "$R/player/screens.json" > /dev/null && "$R/driver/pedal-driver/pedal-driver" --help > /dev/null && echo "the player is in the app"
          bash tools/ci-run.sh "transformers" node tools/smoke-transformers.js central-usage/dist/linux-unpacked/central-control "$R"
          ls -la central-usage/dist/ | grep -E "deb|AppImage"
          [ "$(dpkg-deb -f central-usage/dist/CentralControl-*-amd64.deb Package)" = central-control ] || { echo "::error::Central Control's .deb is the package central-control (since 9.3.1)"; exit 1; }
          dpkg-deb -c central-usage/dist/CentralControl-*-amd64.deb | grep -q "./opt/Central Control/central-control$" || { echo "::error::Central Control should install /opt/Central Control/central-control"; exit 1; }
          dpkg-deb -c central-usage/dist/CentralControl-*-amd64.deb | grep -q "./usr/share/applications/central-control.desktop" || { echo "::error::Central Control's menu entry should be central-control.desktop"; exit 1; }
          dpkg-deb -f central-usage/dist/CentralControl-*-amd64.deb Conflicts Replaces | grep -c "central-usage" | grep -qx 2 || { echo "::error::Central Control must replace the central-usage package (its name from 9.2.1 to 9.3.0)"; exit 1; }
          bash tools/check-linux-deb.sh central-usage/dist/CentralControl-*-amd64.deb "Central Control"
      - name: Central Usage (Linux)
        working-directory: central-usage
        run: |
          rm -rf dist/linux-unpacked
          bash ../tools/ci-run.sh "electron-builder (Central Usage)" npx electron-builder --config usage-builder.js --linux deb AppImage --x64 --publish never
          test -x dist/linux-unpacked/centralusage || { echo "::error::no centralusage program"; exit 1; }
          if [ -e dist/linux-unpacked/resources/player ]; then echo "::error::Central Usage must not carry the player window"; exit 1; fi
          [ "$(dpkg-deb -f dist/CentralUsage-*-amd64.deb Package)" = centralusage ] || { echo "::error::Central Usage's .deb must be its own package (centralusage)"; exit 1; }
          [ -z "$(dpkg-deb -f dist/CentralUsage-*-amd64.deb Conflicts)" ] || { echo "::error::Central Usage must not remove other packages"; exit 1; }
          bash ../tools/check-linux-deb.sh dist/CentralUsage-*-amd64.deb "Central Usage"
          echo "Central Usage: no player window, its own package (installs next to Central Control)"
          ls -la dist/ | grep -E "deb|AppImage"
      - name: Central Pedal Control (Linux)
        run: |
          bash central-pedal-control/prepare.sh
          cd central-pedal-control
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Pedal Control)" npx electron-builder --linux deb AppImage --x64 --publish never
          test -f dist/linux-unpacked/resources/app/js/transfer.js || { echo "::error::the app is missing"; exit 1; }
          dist/linux-unpacked/resources/driver/pedal-driver/pedal-driver --help > /dev/null || { echo "::error::the bundled driver doesn't run"; exit 1; }
          [ "$(dpkg-deb -f dist/central-pedal-control-*-amd64.deb Package)" = central-pedal-control ] || { echo "::error::wrong .deb package name"; exit 1; }
          bash ../tools/check-linux-deb.sh dist/central-pedal-control-*-amd64.deb "Central Pedal Control"
          echo "Central Pedal Control: app + driver"
          ls -la dist/ | grep -E "deb|AppImage"
      - name: Central Services (Linux)
        run: |
          bash central-services/prepare.sh
          cd central-services
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Services)" npx electron-builder --linux deb AppImage --x64 --publish never
          test -f dist/linux-unpacked/resources/app/services.js || { echo "::error::the Central Services page is missing"; exit 1; }
          [ "$(dpkg-deb -f dist/central-services-*-amd64.deb Package)" = central-services ] || { echo "::error::wrong .deb package name"; exit 1; }
          bash ../tools/check-linux-deb.sh dist/central-services-*-amd64.deb "Central Services"
          ls -la dist/ | grep -E "deb|AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          retention-days: 7
          path: |
            central-usage/dist/*.deb
            central-usage/dist/*.AppImage
            central-pedal-control/dist/*.deb
            central-pedal-control/dist/*.AppImage
            central-services/dist/*.deb
            central-services/dist/*.AppImage

  windows:
    name: Windows (x64 installer)
    needs: natives
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: natives-win-x64, path: central-usage/native/build }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - name: Test the engine, the rig, the video helpers (Windows)
        timeout-minutes: 15
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer.exe
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig.exe
          bash tools/ci-run.sh "play any sound: DSP test" central-usage/native/build/test-playany.exe
          bash tools/ci-run.sh "updater test" node central-usage/test-updater.mjs
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Bundle the driver for the player window (PyInstaller) and smoke test it
        timeout-minutes: 20
        run: |
          PYTHON=python bash tools/ci-run.sh "bundle the driver" bash tools/build-driver.sh central-usage/driver-dist
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh central-usage/driver-dist/pedal-driver/pedal-driver.exe
      - name: Central Control
        working-directory: central-usage
        run: |
          node ../tools/make-rig-map.js native/build/rig-map.json
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          bash prepare-player.sh
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "center test" node test-center.mjs
          bash ../tools/ci-run.sh "hub sync test" node test-hubsync.mjs
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test - the packed app (helpers, video, the player, sounds, the speech model's runtime)
        timeout-minutes: 10
        run: |
          R=central-usage/dist/win-unpacked/resources
          "$R/native/cu-mixer.exe" --version && "$R/native/cu-rig.exe" --version && ls "$R/native/cu-ndi.exe" "$R/native/rig-map.json"
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$R/native"
          ls "$R/sounds/"*.sf2 | head -3
          ls "$R/player/pedal-driver.py" > /dev/null && "$R/driver/pedal-driver/pedal-driver.exe" --help > /dev/null && echo "the player is in the app"
          bash tools/ci-run.sh "transformers" node tools/smoke-transformers.js "central-usage/dist/win-unpacked/Central Control.exe" "$R"
          ls -la central-usage/dist/*.exe
      - name: Central Usage (the musicians' app)
        working-directory: central-usage
        run: |
          rm -rf dist/win-unpacked
          bash ../tools/ci-run.sh "electron-builder (Central Usage)" npx electron-builder --config usage-builder.js --win nsis --x64 --publish never
          ls dist/win-unpacked/CentralUsage.exe > /dev/null && ! ls dist/win-unpacked/resources/player > /dev/null 2>&1 && echo "Central Usage: no player window, as it should be"
          ls -la dist/*.exe
      - name: Central Pedal Control (Windows)
        run: |
          bash central-pedal-control/prepare.sh
          cd central-pedal-control
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Pedal Control)" npx electron-builder --win nsis --x64 --publish never
          test -f dist/win-unpacked/resources/app/js/transfer.js || { echo "::error::the app is missing"; exit 1; }
          dist/win-unpacked/resources/driver/pedal-driver/pedal-driver.exe --help > /dev/null || { echo "::error::the bundled driver doesn't run"; exit 1; }
          echo "Central Pedal Control: app + driver"
          ls -la dist/*.exe
      - name: Central Services (Windows)
        run: |
          bash central-services/prepare.sh
          cd central-services
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Services)" npx electron-builder --win nsis --x64 --publish never
          test -f dist/win-unpacked/resources/app/services.js || { echo "::error::the Central Services page is missing"; exit 1; }
          ls -la dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-win
          retention-days: 7
          path: |
            central-usage/dist/*.exe
            central-pedal-control/dist/*.exe
            central-services/dist/*.exe

  macos:
    name: macOS (${{ matrix.arch }})
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, cpu: arm64, runner: macos-15 }
          - { arch: x64, cpu: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - name: Build the native helpers and cu-video (this Mac's architecture) - the rig map from js/pedals.js
        run: |
          bash tools/ci-run.sh "native build" make -C central-usage/native -j4 ARCH="-arch ${{ matrix.cpu }}"
          bash tools/ci-run.sh "cu-video" make -C central-usage/native/video CFLAGS="-O2 -Wall -Wno-unused-function -arch ${{ matrix.cpu }} -mmacosx-version-min=11.0"
          bash tools/fetch-ffmpeg.sh mac-${{ matrix.arch }} central-usage/native/build
      - name: Test the engine, the rig, the video helpers (macOS)
        timeout-minutes: 15
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig
          bash tools/ci-run.sh "play any sound: DSP test" central-usage/native/build/test-playany
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Bundle the driver for the player window (PyInstaller) and smoke test it
        timeout-minutes: 20
        run: |
          PYTHON=python bash tools/ci-run.sh "bundle the driver" bash tools/build-driver.sh central-usage/driver-dist
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh central-usage/driver-dist/pedal-driver/pedal-driver
      - name: Central Control
        working-directory: central-usage
        run: |
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          bash prepare-player.sh
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Smoke test - the packed app (signed, helpers, video, the player, the speech model's runtime)
        timeout-minutes: 10
        run: |
          U=$(ls -d central-usage/dist/mac*/"Central Control.app")
          codesign --verify --deep "$U" && echo "signed: $U"
          "$U/Contents/Resources/native/cu-mixer" --version
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$U/Contents/Resources/native"
          ls "$U/Contents/Resources/player/pedal-driver.py" > /dev/null && "$U/Contents/Resources/driver/pedal-driver/pedal-driver" --help > /dev/null && echo "the player is in the app"
          bash tools/ci-run.sh "transformers" node tools/smoke-transformers.js "$U/Contents/MacOS/Central Control" "$U/Contents/Resources"
          ls -la central-usage/dist/*.dmg
      - name: Central Usage (the musicians' app)
        working-directory: central-usage
        run: |
          rm -rf dist/mac*
          bash ../tools/ci-run.sh "electron-builder (Central Usage)" npx electron-builder --config usage-builder.js --mac dmg --${{ matrix.arch }} --publish never
          U=$(ls -d dist/mac*/CentralUsage.app); codesign --verify --deep "$U" && plutil -p "$U/Contents/Info.plist" | grep -q '"CFBundleDisplayName" => "Central Usage"' && echo "Central Usage: $U"
          ls -la dist/*.dmg
      - name: Central Pedal Control (Mac)
        run: |
          bash central-pedal-control/prepare.sh
          cd central-pedal-control
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Pedal Control)" npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          P=$(ls -d dist/mac*/"Central Pedal Control.app")
          codesign --verify --deep "$P" && ls "$P/Contents/Resources/app/js/transfer.js" > /dev/null && "$P/Contents/Resources/driver/pedal-driver/pedal-driver" --help > /dev/null && echo "Central Pedal Control: app + driver"
          ls -la dist/*.dmg
      - name: Central Services (Mac)
        run: |
          bash central-services/prepare.sh
          cd central-services
          npm install --no-audit --no-fund
          bash ../tools/ci-run.sh "electron-builder (Central Services)" npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
          P=$(ls -d dist/mac*/"Central Services.app")
          codesign --verify --deep "$P" && ls "$P/Contents/Resources/app/services.js" > /dev/null && echo "Central Services: $P"
          ls -la dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac-${{ matrix.arch }}
          retention-days: 7
          path: |
            central-usage/dist/*.dmg
            central-pedal-control/dist/*.dmg
            central-services/dist/*.dmg

  ios:
    name: iPhone / iPad projects (simulator builds, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Central Usage (iPhone / iPad) - Capacitor sync, CocoaPods, simulator build
        run: |
          bash central-usage-mobile/prepare.sh ios
          bash tools/ci-run.sh "iOS build (Central Usage)" xcodebuild build -workspace central-usage-mobile/ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
          echo "Central Usage iOS project builds"
      - name: Central Pedal Control (iPhone / iPad) - the Central Pedal app, simulator build
        run: |
          bash central-pedal-control-mobile/prepare.sh ios
          bash tools/ci-run.sh "iOS build (Central Pedal Control)" xcodebuild build -workspace central-pedal-control-mobile/ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
          echo "Central Pedal Control iPhone / iPad project builds"
      - name: Central Services (iPhone / iPad) - the schedule, simulator build
        run: |
          bash central-services-mobile/prepare.sh ios
          bash tools/ci-run.sh "iOS build (Central Services)" xcodebuild build -workspace central-services-mobile/ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
          echo "Central Services iPhone / iPad project builds"

  android:
    name: Android (Central Usage + Central Pedal Control APKs)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Build the APK (signed with the team's key when the ANDROID_KEYSTORE_B64 secret is set - INSTALL.md)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          CU=$(node -p "require('./central-usage/package.json').version")
          bash central-usage-mobile/prepare.sh android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cu.keystore"; export CU_KEYSTORE="$RUNNER_TEMP/cu.keystore" CU_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"; echo "signed with the team's key"; else echo "::warning::No ANDROID_KEYSTORE_B64 secret: the APK is signed with a debug key (it installs, but a later version can't update it - INSTALL.md)"; fi
          cd central-usage-mobile/android && chmod +x gradlew
          CU_VERSION=$CU bash ../../tools/ci-run.sh "gradle" ./gradlew --no-daemon -q assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/CentralUsage-$CU.apk"
          ls -la ../dist
      - name: Central Pedal Control APK (the Central Pedal app on an Android phone / tablet)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          PC=$(node -p "require('./central-pedal-control/package.json').version")
          bash central-pedal-control-mobile/prepare.sh android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cu.keystore"; export CU_KEYSTORE="$RUNNER_TEMP/cu.keystore" CU_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"; fi
          cd central-pedal-control-mobile/android && chmod +x gradlew
          PC_VERSION=$PC bash ../../tools/ci-run.sh "gradle (Central Pedal Control)" ./gradlew --no-daemon -q assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/central-pedal-control-$PC-android.apk"
          unzip -l "../dist/central-pedal-control-$PC-android.apk" > "$RUNNER_TEMP/apk.txt"
          grep -q "assets/public/js/transfer.js" "$RUNNER_TEMP/apk.txt" || { echo "::error::the Central Pedal app is not in the APK"; exit 1; }
          echo "the Central Pedal app is inside"
          ls -la ../dist
      - name: Central Services APK (the schedule on an Android phone / tablet)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          CS=$(node -p "require('./central-services/package.json').version")
          bash central-services-mobile/prepare.sh android
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cu.keystore"; export CU_KEYSTORE="$RUNNER_TEMP/cu.keystore" CU_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"; fi
          cd central-services-mobile/android && chmod +x gradlew
          CS_VERSION=$CS bash ../../tools/ci-run.sh "gradle (Central Services)" ./gradlew --no-daemon -q assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/central-services-$CS-android.apk"
          unzip -l "../dist/central-services-$CS-android.apk" | grep -q "assets/public/services.js" || { echo "::error::the Central Services page is not in the APK"; exit 1; }
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: installers-android
          retention-days: 7
          path: |
            central-usage-mobile/dist/*.apk
            central-pedal-control-mobile/dist/*.apk
            central-services-mobile/dist/*.apk

  names:
    name: Every installer is there, with the names the updaters look for (and their sizes)
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, path: staging, merge-multiple: true }
      - run: |
          CU=$(node -p "require('./central-usage/package.json').version")
          PC=$(node -p "require('./central-pedal-control/package.json').version")
          CS=$(node -p "require('./central-services/package.json').version")
          missing=0; sizes=""
          for f in CentralControl-$CU-win-x64.exe CentralControl-$CU-mac-arm64.dmg CentralControl-$CU-mac-x64.dmg CentralControl-$CU-amd64.deb CentralControl-$CU-x86_64.AppImage \
                   CentralUsage-$CU-win-x64.exe CentralUsage-$CU-mac-arm64.dmg CentralUsage-$CU-mac-x64.dmg CentralUsage-$CU.apk \
                   CentralUsage-$CU-amd64.deb CentralUsage-$CU-x86_64.AppImage \
                   central-pedal-control-$PC-mac-arm64.dmg central-pedal-control-$PC-mac-x64.dmg central-pedal-control-$PC-win-x64.exe \
                   central-pedal-control-$PC-amd64.deb central-pedal-control-$PC-x86_64.AppImage central-pedal-control-$PC-android.apk \
                   central-services-$CS-mac-arm64.dmg central-services-$CS-mac-x64.dmg central-services-$CS-win-x64.exe \
                   central-services-$CS-amd64.deb central-services-$CS-x86_64.AppImage central-services-$CS-android.apk; do
            p=$(find staging -type f -name "$f" | head -1)
            if [ -n "$p" ]; then s=$(( $(stat -c %s "$p") / 1048576 )); echo "ok  $f  ${s} MB"; sizes="$sizes$f ${s} MB%0A"; echo "| $f | ${s} MB |" >> sizes.md; else echo "::error::missing $f"; missing=1; fi
          done
          echo "::notice title=Installer sizes::$sizes"
          { echo "### Installer sizes"; echo "| File | Size |"; echo "|---|---|"; cat sizes.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $missing
