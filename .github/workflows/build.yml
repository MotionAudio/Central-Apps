# Builds every installer: Central Usage and Central Control for Linux, Windows and macOS (Apple Silicon and
# Intel), with their native helpers (cu-mixer, cu-ndi, cu-rig, cu-video), the pinned ffmpeg, the bundled
# driver, the built-in sounds and the offline speech model's runtime - and tests them on each system.
# Used by release.yml (every release ships all of them); also runs by itself on the work branches and by hand.
#
# Adding a native helper for every system: build it in the "natives" job (Linux, Windows cross-compiled) and in
# the macos jobs, put it in central-usage/native/build/, list it in central-usage/package.json ->
# build.extraResources[0].filter, and check it in the "packed apps" steps.
# rig-map.json (which built-in effect plays each pedal of js/pedals.js) is always made here from the current
# catalogue (tools/make-rig-map.js) - never checked in - so new pedals map by themselves.
name: Build
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [platforms, v8.1]
permissions:
  contents: read
jobs:
  natives:
    name: Native helpers (Linux + Windows), ffmpeg and sounds
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Compilers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 p7zip-full
      - name: Build (Linux x64, Windows x64) - the rig map comes from js/pedals.js here
        run: |
          bash tools/ci-run.sh "native build (Linux)" make -C central-usage/native -j4
          bash tools/ci-run.sh "native build (Windows)" make -C central-usage/native -j4 TARGET=win OUT=build-win
          bash tools/ci-run.sh "cu-video (Linux)" make -C central-usage/native/video
          bash tools/ci-run.sh "cu-video (Windows)" make -C central-usage/native/video CC=x86_64-w64-mingw32-gcc EXE=.exe LIBS="-lole32 -lwinmm -static"
          mv central-usage/native/build/cu-video.exe central-usage/native/build-win/
          node -e 'const m=require("./central-usage/native/build/rig-map.json"),P=require("./js/pedals.js");const miss=P.pedals.filter(p=>!m[p.id]).map(p=>p.id);if(miss.length){console.log("::error::pedals missing from the rig map: "+miss.join(", "));process.exit(1)}console.log("rig map: "+Object.keys(m).length+" pedals, all of js/pedals.js")'
      - name: ffmpeg (pinned, checksum-checked)
        run: |
          bash tools/fetch-ffmpeg.sh linux-x64 central-usage/native/build
          bash tools/fetch-ffmpeg.sh win-x64 central-usage/native/build-win
      - name: Test the engine, the rig, the video helpers (Linux)
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig
          bash tools/ci-run.sh "updater test" node central-usage/test-updater.mjs
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Built-in sounds
        run: bash tools/fetch-builtin-sounds.sh central-usage/native/sounds
      - uses: actions/upload-artifact@v4
        with: { name: natives-linux-x64, path: central-usage/native/build/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: natives-win-x64, path: central-usage/native/build-win/, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds/, retention-days: 7 }

  linux:
    name: Linux (deb + AppImage)
    needs: natives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/download-artifact@v4
        with: { name: natives-linux-x64, path: central-usage/native/build }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - name: Smoke test - the driver answers (system Python, as the .deb runs it)
        run: |
          pip install --quiet websockets==13.1 gpiozero==2.0.1 pillow
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh python3 pedal-driver.py
      - name: Central Usage
        working-directory: central-usage
        run: |
          chmod +x native/build/cu-* native/build/ffmpeg || true
          node ../tools/make-rig-map.js native/build/rig-map.json
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Central Control for PC
        run: |
          bash central-control-desktop/prepare-src.sh
          cd central-control-desktop
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --linux deb AppImage --x64 --publish never
      - name: Smoke test - the packed apps (helpers, video, sounds, the speech model's runtime)
        run: |
          R=central-usage/dist/linux-unpacked/resources; C=central-control-desktop/dist/linux-unpacked/resources
          "$R/native/cu-mixer" --version && "$R/native/cu-rig" --version && ls "$R/native/rig-map.json" "$R/sounds/"*.sf2 > /dev/null
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$R/native"
          ls "$C/native/cu-rig" "$C/app/pedal-driver.py" "$C/app/native_rig.py" > /dev/null && echo ok
          bash tools/ci-run.sh "transformers (Central Usage)" node tools/smoke-transformers.js central-usage/dist/linux-unpacked/central-usage "$R"
          bash tools/ci-run.sh "transformers (Central Control)" node tools/smoke-transformers.js central-control-desktop/dist/linux-unpacked/central-control "$C"
          ls -la central-usage/dist/ central-control-desktop/dist/ | grep -E "deb|AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          retention-days: 7
          path: |
            central-usage/dist/*.deb
            central-usage/dist/*.AppImage
            central-control-desktop/dist/*.deb
            central-control-desktop/dist/*.AppImage

  windows:
    name: Windows (x64 installer)
    needs: natives
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: natives-win-x64, path: central-usage/native/build }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - name: Test the engine, the rig, the video helpers (Windows)
        timeout-minutes: 15
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer.exe
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig.exe
          bash tools/ci-run.sh "updater test" node central-usage/test-updater.mjs
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Bundle the driver (PyInstaller) and smoke test it
        timeout-minutes: 20
        run: |
          PYTHON=python bash tools/ci-run.sh "bundle the driver" bash tools/build-driver.sh central-control-desktop/driver-dist
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh central-control-desktop/driver-dist/pedal-driver/pedal-driver.exe
      - name: Central Usage
        working-directory: central-usage
        run: |
          node ../tools/make-rig-map.js native/build/rig-map.json
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --win nsis --x64 --publish never
      - name: Central Control for PC
        run: |
          bash central-control-desktop/prepare-src.sh
          cd central-control-desktop
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --win nsis --x64 --publish never
      - name: Smoke test - the packed apps (helpers, video, driver, sounds, the speech model's runtime)
        timeout-minutes: 10
        run: |
          R=central-usage/dist/win-unpacked/resources; C=central-control-desktop/dist/win-unpacked/resources
          "$R/native/cu-mixer.exe" --version && "$R/native/cu-rig.exe" --version && ls "$R/native/cu-ndi.exe" "$R/native/rig-map.json"
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$R/native"
          ls "$R/sounds/"*.sf2 | head -3 && ls "$C/native/cu-rig.exe" "$C/sounds/"*.sf2 > /dev/null
          "$C/driver/pedal-driver/pedal-driver.exe" --help > /dev/null && echo "driver runs from the app"
          bash tools/ci-run.sh "transformers (Central Usage)" node tools/smoke-transformers.js "central-usage/dist/win-unpacked/Central Usage.exe" "$R"
          bash tools/ci-run.sh "transformers (Central Control)" node tools/smoke-transformers.js "central-control-desktop/dist/win-unpacked/Central Control.exe" "$C"
          ls -la central-usage/dist/*.exe central-control-desktop/dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installers-win
          retention-days: 7
          path: |
            central-usage/dist/*.exe
            central-control-desktop/dist/*.exe

  macos:
    name: macOS (${{ matrix.arch }})
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, cpu: arm64, runner: macos-15 }
          - { arch: x64, cpu: x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/download-artifact@v4
        with: { name: sounds, path: central-usage/native/sounds }
      - name: Build the native helpers and cu-video (this Mac's architecture) - the rig map from js/pedals.js
        run: |
          bash tools/ci-run.sh "native build" make -C central-usage/native -j4 ARCH="-arch ${{ matrix.cpu }}"
          bash tools/ci-run.sh "cu-video" make -C central-usage/native/video CFLAGS="-O2 -Wall -Wno-unused-function -arch ${{ matrix.cpu }} -mmacosx-version-min=11.0"
          bash tools/fetch-ffmpeg.sh mac-${{ matrix.arch }} central-usage/native/build
      - name: Test the engine, the rig, the video helpers (macOS)
        timeout-minutes: 15
        run: |
          bash tools/ci-run.sh "engine test" node central-usage/native/test-mixer.mjs central-usage/native/build/cu-mixer
          bash tools/ci-run.sh "rig test" node central-usage/native/test-rig.mjs central-usage/native/build/cu-rig
          bash tools/ci-run.sh "video smoke test" bash tools/smoke-video.sh central-usage/native/build
      - name: Bundle the driver (PyInstaller) and smoke test it
        timeout-minutes: 20
        run: |
          PYTHON=python bash tools/ci-run.sh "bundle the driver" bash tools/build-driver.sh central-control-desktop/driver-dist
          bash tools/ci-run.sh "driver smoke test" bash tools/smoke-driver.sh central-control-desktop/driver-dist/pedal-driver/pedal-driver
      - name: Central Usage
        working-directory: central-usage
        run: |
          CU_SKIP_NATIVE=1 bash prepare-shared.sh
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Central Control for PC
        run: |
          bash central-control-desktop/prepare-src.sh
          cd central-control-desktop
          npm install --no-audit --no-fund
          node ../tools/prune-onnx.js .
          bash ../tools/ci-run.sh "electron-builder" npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - name: Smoke test - the packed apps (signed, helpers, video, driver, the speech model's runtime)
        timeout-minutes: 10
        run: |
          U=$(ls -d central-usage/dist/mac*/"Central Usage.app"); K=$(ls -d central-control-desktop/dist/mac*/"Central Control.app")
          for app in "$U" "$K"; do codesign --verify --deep "$app" && echo "signed: $app"; done
          "$U/Contents/Resources/native/cu-mixer" --version
          bash tools/ci-run.sh "packed video" bash tools/smoke-video.sh "$U/Contents/Resources/native"
          "$K/Contents/Resources/driver/pedal-driver/pedal-driver" --help > /dev/null && echo "driver runs from the app"
          bash tools/ci-run.sh "transformers (Central Usage)" node tools/smoke-transformers.js "$U/Contents/MacOS/Central Usage" "$U/Contents/Resources"
          bash tools/ci-run.sh "transformers (Central Control)" node tools/smoke-transformers.js "$K/Contents/MacOS/Central Control" "$K/Contents/Resources"
          ls -la central-usage/dist/*.dmg central-control-desktop/dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac-${{ matrix.arch }}
          retention-days: 7
          path: |
            central-usage/dist/*.dmg
            central-control-desktop/dist/*.dmg

  ios:
    name: iPhone / iPad project (simulator build, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Prepare (Capacitor sync, CocoaPods)
        run: bash central-usage-ios/prepare.sh
      - name: Build for the simulator (proves the project compiles; the App Store build is in release.yml)
        run: |
          bash tools/ci-run.sh "iOS build" xcodebuild build -workspace central-usage-ios/ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
          echo "iOS project builds"

  names:
    name: Every installer is there, with the names the updaters look for (and their sizes)
    needs: [linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, path: staging, merge-multiple: true }
      - run: |
          CU=$(node -p "require('./central-usage/package.json').version"); CC=$(node -p "require('./central-control-desktop/package.json').version")
          missing=0; sizes=""
          for f in central-usage-$CU-win-x64.exe central-usage-$CU-mac-arm64.dmg central-usage-$CU-mac-x64.dmg central-usage-$CU-amd64.deb central-usage-$CU-x86_64.AppImage \
                   central-control-$CC-win-x64.exe central-control-$CC-mac-arm64.dmg central-control-$CC-mac-x64.dmg central-control-$CC-amd64.deb central-control-$CC-x86_64.AppImage; do
            p=$(find staging -type f -name "$f" | head -1)
            if [ -n "$p" ]; then s=$(( $(stat -c %s "$p") / 1048576 )); echo "ok  $f  ${s} MB"; sizes="$sizes$f ${s} MB%0A"; echo "| $f | ${s} MB |" >> sizes.md; else echo "::error::missing $f"; missing=1; fi
          done
          echo "::notice title=Installer sizes::$sizes"
          { echo "### Installer sizes"; echo "| File | Size |"; echo "|---|---|"; cat sizes.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $missing
