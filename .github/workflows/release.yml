# Builds and publishes a release whenever main has a version that has no release yet.
# The version comes from APP_VERSION in pedal-driver.py (tag v<version>); the PC apps' own versions come
# from their package.json files. The apps' update checks read the newest release of this repository, so
# every install - Raspberry Pi, Linux, Windows, macOS - updates itself from it.
#
# Every release has the four apps: the Raspberry Pi update for Central Pedal (central-control-source.zip);
# Central Pedal Control for Mac (central-pedal-control-*-mac-arm64 / -x64.dmg); Central Control (central-usage-*
# files - their old name) for Linux (.deb, .AppImage), Windows (-win-x64.exe) and macOS (-mac-arm64.dmg, -mac-x64.dmg);
# Central Usage (CentralUsage-*) for Windows, macOS and Android (.apk); SHA256SUMS. iPhone / iPad: TestFlight / the
# App Store once the Apple account is set up (the ios job below, IOS-APP-STORE.md).
# Optional: a copy of every release in Google Drive - see DRIVE-SETUP.md (secret RCLONE_CONFIG).
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER=$(sed -nE 's/^APP_VERSION = "([^"]+)".*/\1/p' pedal-driver.py | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: version
    if: needs.version.outputs.exists == '0'
    uses: ./.github/workflows/build.yml
    secrets: inherit   # (the Android signing key, when it is set up - INSTALL.md)

  publish:
    needs: [version, build]
    if: needs.version.outputs.exists == '0'
    runs-on: ubuntu-22.04
    env:
      VER: ${{ needs.version.outputs.version }}
      RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
      FOLDER: ${{ vars.GDRIVE_FOLDER || 'Central Apps' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: installers-*, path: staging, merge-multiple: true }
      - name: Make the release files
        run: |
          mkdir -p central-usage/dist
          find staging -type f \( -name 'central-usage-*' -o -name 'CentralUsage-*' -o -name 'central-pedal-control-*' \) -exec mv {} central-usage/dist/ \;
          bash make-release.sh "$VER"
          for want in "central-usage-*-win-x64.exe" "central-usage-*-mac-arm64.dmg" "central-usage-*-mac-x64.dmg" "central-usage-*-amd64.deb" "central-usage-*-x86_64.AppImage" "central-control-source.zip" \
                      "CentralUsage-*-win-x64.exe" "CentralUsage-*-mac-arm64.dmg" "CentralUsage-*-mac-x64.dmg" "CentralUsage-*.apk" "central-pedal-control-*-mac-arm64.dmg" "central-pedal-control-*-mac-x64.dmg"; do
            ls release/$VER/$want >/dev/null 2>&1 || { echo "missing from the release: $want"; exit 1; }
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=release-notes/$VER.md; [ -f "$NOTES" ] || { echo "Central Control $VER" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          gh release create "v$VER" release/$VER/* --title "Central Pedal $VER" --notes-file "$NOTES" --target "$GITHUB_SHA"
      - name: Copy to Google Drive (when set up - DRIVE-SETUP.md)
        if: env.RCLONE_CONF != ''
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone copy "release/$VER" "gdrive:$FOLDER/$VER" --progress=false
          rclone sync "release/$VER" "gdrive:$FOLDER/latest" --progress=false
          echo "copied to Google Drive: $FOLDER/$VER and $FOLDER/latest"

  ios:
    # iPhone / iPad: build, sign and upload to TestFlight / App Store Connect - only when the Apple secrets are
    # set (IOS-APP-STORE.md). Without them this job does nothing.
    needs: [version, publish]
    if: needs.version.outputs.exists == '0'
    runs-on: macos-15
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
    steps:
      - name: Apple secrets set?
        id: s
        run: if [ -n "$TEAM" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "No Apple secrets - skipping the App Store build (IOS-APP-STORE.md)"; fi
      - uses: actions/checkout@v4
        if: steps.s.outputs.go == '1'
      - uses: actions/setup-node@v4
        if: steps.s.outputs.go == '1'
        with: { node-version: 20 }
      - name: Build, sign (Xcode cloud signing with the API key) and upload - Central Usage (iPhone / iPad) and Central Pedal Control (iPad)
        if: steps.s.outputs.go == '1'
        run: |
          mkdir -p ~/private_keys && printf '%s\n' "$KEY" > ~/private_keys/AuthKey_$KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM</string><key>signingStyle</key><string>automatic</string></dict></plist>
          PLIST
          CUV=$(node -p "require('./central-usage/package.json').version")
          PCV=$(node -p "require('./central-pedal-control/package.json').version")
          bash central-usage-mobile/prepare.sh ios
          bash central-pedal-control-ios/prepare.sh
          for app in "central-usage-mobile:$CUV:Central Usage" "central-pedal-control-ios:$PCV:Central Pedal Control"; do
            DIR=${app%%:*}; rest=${app#*:}; V=${rest%%:*}; NAME=${rest#*:}
            xcodebuild archive -workspace $DIR/ios/App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/$DIR.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $AUTH -quiet
            xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$DIR.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export-$DIR" $AUTH
            echo "uploaded $NAME $V ($GITHUB_RUN_NUMBER) to App Store Connect - it shows in TestFlight after Apple's processing"
          done
