name: Build Motion Studio (macOS)

# Builds the universal (Apple Silicon + Intel) Motion Studio.app and .dmg on a Mac runner, then commits the
# result (or the build log if it failed) to out/ on this branch.

on:
  push:
    branches: [ motion-studio ]
    paths-ignore: [ 'out/**' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-studio-mac
  cancel-in-progress: true

jobs:
  mac:
    if: ${{ !contains(github.event.head_commit.message, '[build output]') }}
    runs-on: macos-15   # (macos-14 Apple-silicon runners are retired)
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install ninja ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
          restore-keys: ccache-mac-

      - name: Tracktion Engine + JUCE
        run: bash scripts/get-deps.sh

      - name: Configure
        run: |
          ccache --max-size=4G
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DTE_DIR="$PWD/deps/tracktion_engine" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log

      - name: Build (universal)
        run: |
          set -o pipefail
          cmake --build build-mac --config Release -- -k 0 2>&1 | tee build.log
          ccache -s || true

      - name: Sign (ad hoc) and make the .dmg
        run: |
          APP="build-mac/MotionStudio_artefacts/Release/Motion Studio.app"
          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/Motion Studio"
          rm -rf dmg && mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Motion Studio" -srcfolder dmg -ov -format UDZO MotionStudio.dmg
          ls -la MotionStudio.dmg

      - name: Smoke test
        run: |
          BIN="build-mac/MotionStudio_artefacts/Release/Motion Studio.app/Contents/MacOS/Motion Studio"
          run() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          run 180 "$BIN" --render-demo "$PWD/demo.wav" > smoke.log 2>&1 || echo "render exit $?" >> smoke.log
          run 180 "$BIN" --test-roundtrip >> smoke.log 2>&1 || echo "roundtrip exit $?" >> smoke.log
          run 300 "$BIN" --test-vocal >> smoke.log 2>&1 || echo "vocal tests exit $?" >> smoke.log
          ls -la demo.wav >> smoke.log 2>&1 || true

      - name: Publish the result to this branch
        if: always()
        run: |
          mkdir -p out
          rm -f out/*
          echo "${{ job.status }} $(date -u)" > out/status.txt
          [ -f configure.log ] && tail -n 60 configure.log > out/configure-tail.log || true
          [ -f build.log ] && grep -nE "error|Error|FAILED" build.log | head -n 300 > out/build-errors.log || true
          [ -f build.log ] && tail -n 120 build.log > out/build-tail.log || true
          [ -f smoke.log ] && cp smoke.log out/ || true
          if [ -f MotionStudio.dmg ]; then
            split -b 90m MotionStudio.dmg out/MotionStudio.dmg.part-
          fi
          git config user.name "Motion Studio CI"
          git config user.email "support@motionaudio.org"
          git add -f out
          git commit -m "[build output] ${{ job.status }}" || exit 0
          git pull --rebase origin motion-studio || true
          git push origin HEAD:motion-studio
