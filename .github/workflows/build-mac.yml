name: Build Motion Studio (macOS)

# Builds the universal (Apple Silicon + Intel) Motion Studio.app and .dmg on a Mac runner, runs the smoke tests, and
# puts the .dmg on this repo's Releases page (the release named after the version in CMakeLists.txt, replaced on a
# rebuild). Runs when code changes on main, or by hand from the Actions tab (Run workflow).

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motion-studio-mac
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install ninja ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-mac-${{ github.sha }}
          restore-keys: ccache-mac-

      - name: Tracktion Engine + JUCE
        run: bash scripts/get-deps.sh

      - name: Configure
        run: |
          ccache --max-size=4G
          cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DTE_DIR="$PWD/deps/tracktion_engine" -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build (universal)
        run: |
          set -o pipefail
          cmake --build build-mac --config Release 2>&1 | tee build.log
          ccache -s || true

      - name: Sign (ad hoc) and make the .dmg
        run: |
          APP="build-mac/MotionStudio_artefacts/Release/Motion Studio.app"
          codesign --force --deep --sign - "$APP"
          lipo -info "$APP/Contents/MacOS/Motion Studio"
          rm -rf dmg && mkdir -p dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "Motion Studio" -srcfolder dmg -ov -format UDZO MotionStudio.dmg
          ls -la MotionStudio.dmg

      - name: Smoke test
        run: |
          set -o pipefail
          BIN="build-mac/MotionStudio_artefacts/Release/Motion Studio.app/Contents/MacOS/Motion Studio"
          run() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          run 180 "$BIN" --render-demo "$PWD/demo.wav" 2>&1 | tee smoke.log
          run 180 "$BIN" --test-roundtrip 2>&1 | tee -a smoke.log
          run 300 "$BIN" --test-vocal 2>&1 | tee -a smoke.log
          grep -q "ROUNDTRIP OK" smoke.log && grep -q "ALL VOCAL TESTS PASSED" smoke.log

      - name: Put the .dmg on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -nE 's/^project *\( *MotionStudio +VERSION +([0-9.]+).*/\1/p' CMakeLists.txt | head -n 1)
          VER=${VER:-1.0.0}
          TAG="v$VER"
          NOTES="Motion Studio $VER for macOS (Apple Silicon and Intel in one app), built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d').

          Open the .dmg and drag Motion Studio into Applications. It isn't signed by Apple, so the first time: right-click the app, choose Open, then Open again."
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" MotionStudio.dmg --title "Motion Studio $VER" --notes "$NOTES" --target "$GITHUB_SHA"
