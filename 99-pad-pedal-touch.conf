# Pad Pedal OS: the 3.5-inch screen's touch panel belongs to the Pad Pedal driver,
# not to the HDMI screen. Without this, touching the small screen would click on HDMI 1.
Section "InputClass"
    Identifier "pad-pedal ignore ADS7846 touch"
    MatchProduct "ADS7846"
    Option "Ignore" "true"
EndSection
